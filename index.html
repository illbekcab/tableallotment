<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Allotment - Details</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0a0a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Lato', sans-serif;
  }

  .venue {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 2.2vh, 30px);
    letter-spacing: 0.28em; text-transform: uppercase; color: #c9a96e;
    margin-bottom: clamp(2px, 0.3vh, 5px);
  }

  h1 {
    font-family: 'Lato', sans-serif;
    font-size: clamp(9px, 1.1vh, 14px); font-weight: 300;
    letter-spacing: 0.45em; text-transform: uppercase; color: #5a4a2e;
    margin-bottom: clamp(3px, 0.5vh, 8px);
  }

  /* ── Loading / Error Screen ── */
  #status-screen {
    position: fixed; inset: 0; background: rgba(10,10,10,0.97);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; gap: 18px;
  }
  #status-screen.hidden { display: none; }
  #status-title {
    font-family: 'Playfair Display', serif; font-size: clamp(18px, 2.5vh, 32px);
    letter-spacing: 0.25em; text-transform: uppercase; color: #c9a96e;
  }
  #status-msg {
    font-size: clamp(10px, 1.2vh, 14px); font-weight: 300;
    letter-spacing: 0.3em; text-transform: uppercase; color: #5a4a2e;
    text-align: center; max-width: 520px; line-height: 2;
  }
  #status-msg.error { color: #c97a7a; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #2a2010;
    border-top-color: #c9a96e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: clamp(4px, 0.6vmin, 10px);
    width: min(98vw, 115vh);
    height: min(74vw, 80vh);
  }

  .cell {
    background: #161410;
    border: 1px solid #3a2e1a; border-radius: 4px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    overflow: hidden; padding: 5px 4px 4px;
    user-select: none; position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,169,110,0.06);
    animation: fadeUp 0.35s ease both;
  }
  .cell::before {
    content: ''; position: absolute;
    top: 0; left: 10%; right: 10%; height: 2px;
    background: linear-gradient(90deg, transparent, #c9a96e55, transparent);
    border-radius: 0 0 2px 2px; z-index: 1;
  }
  .cell:hover {
    border-color: #c9a96e66; background: #1e1a10;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(201,169,110,0.12);
  }

  /* ── Manual highlight ── */
  .cell.highlighted {
    background: linear-gradient(160deg, #2e2410, #1c1508, #241c0a);
    border-color: #c9a96e;
    box-shadow: 0 0 18px rgba(201,169,110,0.3), 0 4px 12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,169,110,0.2);
  }
  .cell.highlighted::before { background: linear-gradient(90deg, transparent, #c9a96e, transparent); }
  .cell.highlighted .num { color: #f0d080; text-shadow: 0 0 12px rgba(240,208,128,0.4); }
  .cell.highlighted .label { color: #c9a96e; }

  /* ── External participant — subtle muted green ── */
  .cell.external {
    background: linear-gradient(160deg, #0e1610, #111a12, #0f1a11);
    border-color: #4a7a52;
    box-shadow: 0 0 10px rgba(74,122,82,0.18), 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(90,160,100,0.08);
  }
  .cell.external::before { background: linear-gradient(90deg, transparent, #4a7a5244, transparent); }
  .cell.external .num { color: #7ab882; }
  .cell.external .label { color: #6aaa74; }
  .cell.external .team-label { color: #4a7a52; }
  .cell.external:hover { border-color: #6aaa74; box-shadow: 0 0 14px rgba(90,160,100,0.22), 0 4px 12px rgba(0,0,0,0.6); }
  .cell.external .ext-badge { display: block; }
  .cell.external .inner { border-color: #4a7a5228; }

  /* external + manual highlight */
  .cell.external.highlighted {
    background: linear-gradient(160deg, #162318, #1a2e1c, #162318);
    border-color: #c9a96e;
    box-shadow: 0 0 18px rgba(201,169,110,0.28), 0 0 10px rgba(74,122,82,0.15), 0 4px 12px rgba(0,0,0,0.5);
  }
  .cell.external.highlighted::before { background: linear-gradient(90deg, transparent, #c9a96e, transparent); }
  .cell.external.highlighted .num { color: #f0d080; text-shadow: 0 0 12px rgba(240,208,128,0.4); }
  .cell.external.highlighted .label { color: #c9a96e; }

  /* ── Inner frame ── */
  .inner {
    width: calc(100% - 6px); height: calc(100% - 6px);
    border: 1px solid #2a2010; border-radius: 2px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-around;
    pointer-events: none; position: relative; z-index: 2;
  }
  .cell.highlighted .inner { border-color: #c9a96e33; }

  .num {
    font-family: 'Playfair Display', serif;
    font-size: clamp(11px, 1.8vmin, 20px); font-weight: 700;
    color: #c9a96e; line-height: 1; pointer-events: none; flex-shrink: 0;
  }
  .label {
    font-size: clamp(8px, 1.4vmin, 16px); font-weight: 700;
    letter-spacing: 0.03em; color: #c9a96e; text-align: center;
    word-break: break-word; line-height: 1.2; max-width: 90%;
    outline: none; border: none; background: transparent;
    padding: 1px 2px; border-radius: 3px;
    transition: background 0.15s, color 0.15s;
    cursor: text; pointer-events: all; user-select: text; flex-shrink: 0;
  }
  .label:focus { background: rgba(201,169,110,0.1); color: #ddd; outline: 1px solid rgba(201,169,110,0.3); }
  .label:empty::before { content: attr(data-placeholder); color: #2a2010; }

  .team-label {
    font-family: 'Lato', sans-serif;
    font-size: clamp(5px, 0.9vmin, 10px); font-weight: 400;
    letter-spacing: 0.04em; color: #7a6040; text-align: center;
    max-width: 92%; outline: none; border: none; background: transparent;
    padding: 1px 2px; border-radius: 3px;
    transition: background 0.15s, color 0.15s;
    cursor: text; pointer-events: all; user-select: text; flex-shrink: 0;
    word-break: break-word; line-height: 1.1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .team-label:focus { background: rgba(201,169,110,0.08); color: #bbb; outline: 1px solid rgba(201,169,110,0.2); white-space: normal; }
  .team-label:empty::before { content: attr(data-placeholder); color: #1e1a0e; }

  .ext-badge {
    display: none; font-size: clamp(4px, 0.7vmin, 8px); font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase; color: #6aaa74;
    background: rgba(74,122,82,0.12); border: 1px solid rgba(74,122,82,0.35);
    border-radius: 2px; padding: 1px 4px; line-height: 1.4;
    flex-shrink: 0; pointer-events: none;
  }

  /* ── Group strip — colored bottom bar per problem prefix ── */
  .group-strip {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    border-radius: 0 0 3px 3px;
    pointer-events: none; z-index: 5;
    opacity: 0.65;
    transition: opacity 0.2s, height 0.15s;
  }
  .cell:hover .group-strip { opacity: 1; height: 4px; }
  .cell.highlighted .group-strip { opacity: 1; height: 4px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex; gap: 16px; align-items: center;
    margin-bottom: clamp(3px, 0.5vh, 7px);
    max-width: min(98vw, 115vh); width: min(98vw, 115vh);
    justify-content: space-between;
  }
  .legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: clamp(7px, 0.85vh, 10px); letter-spacing: 0.15em;
    text-transform: uppercase; color: #3a2e1a;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .legend-dot.normal { background: #3a2e1a; border: 1px solid #c9a96e44; }
  .legend-dot.ext    { background: rgba(74,122,82,0.25); border: 1px solid #4a7a52; }
  .legend-dot.hl     { background: #2e2410; border: 1px solid #c9a96e; }
  #reload-btn {
    font-family: 'Lato', sans-serif; font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase; color: #3a2e1a; background: transparent;
    border: 1px solid #2a2010; padding: 3px 10px; border-radius: 3px;
    cursor: pointer; transition: border-color 0.2s, color 0.2s; flex-shrink: 0;
  }
  #reload-btn:hover { border-color: #c9a96e55; color: #7a6040; }

  /* ── Group legend below grid ── */
  .group-legend {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    align-items: center; justify-content: center;
    margin-top: clamp(3px, 0.45vh, 7px);
    max-width: min(98vw, 115vh);
  }
  .group-legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: clamp(7px, 0.82vh, 10px); letter-spacing: 0.16em;
    text-transform: uppercase; color: #4a3a20;
    cursor: pointer; padding: 2px 8px; border-radius: 3px;
    border: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    user-select: none;
  }
  .group-legend-item:hover { color: #8a7040; border-color: #3a2e1a; }
  .group-legend-item.active { color: #c9a96e; border-color: #c9a96e55; background: rgba(201,169,110,0.06); }
  .group-legend-bar { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }

  .footer {
    margin-top: clamp(3px, 0.45vh, 6px);
    font-size: clamp(7px, 0.9vh, 10px); color: #2e2416;
    letter-spacing: 0.18em; text-transform: uppercase;
  }

  /* ── Detail Modal ── */
  #detail-modal {
    display: none; position: fixed; inset: 0; z-index: 300;
    align-items: center; justify-content: center;
  }
  #detail-modal.open { display: flex; }
  .modal-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.78);
    backdrop-filter: blur(3px);
  }
  .modal-card {
    position: relative; z-index: 1; background: #0f0d09;
    border: 1px solid #3a2e1a; border-radius: 8px; padding: 28px 32px;
    min-width: 320px; max-width: 440px; width: 90vw;
    box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 0 1px #c9a96e1a;
    animation: modalIn 0.22s ease both; max-height: 88vh; overflow-y: auto;
  }
  .modal-card.external-card {
    border-color: #4a7a5266;
    box-shadow: 0 0 50px rgba(74,122,82,0.12), 0 0 0 1px #4a7a5222;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.93) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-top-line {
    height: 2px; background: linear-gradient(90deg, transparent, #c9a96e, transparent);
    border-radius: 2px; margin-bottom: 20px;
  }
  .modal-card.external-card .modal-top-line {
    background: linear-gradient(90deg, transparent, #6aaa74, transparent);
  }
  .modal-table-num {
    font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase;
    color: #4a3820; margin-bottom: 4px;
  }
  .modal-team-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 2.2vh, 26px); font-weight: 700;
    color: #c9a96e; margin-bottom: 18px; line-height: 1.2;
  }
  .modal-card.external-card .modal-team-name { color: #7ab882; }
  .modal-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .modal-row-label {
    font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
    color: #4a3820; min-width: 110px; padding-top: 2px; flex-shrink: 0;
  }
  .modal-row-value { font-size: 13px; color: #9a7a4a; letter-spacing: 0.04em; line-height: 1.5; }

  .participant-pill {
    display: inline-block; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; border-radius: 3px;
    padding: 2px 10px; line-height: 1.8;
  }
  .pill-internal { background: rgba(201,169,110,0.12); border: 1px solid rgba(201,169,110,0.35); color: #c9a96e; }
  .pill-external { background: rgba(74,122,82,0.14); border: 1px solid rgba(74,122,82,0.45); color: #6aaa74; }
  .pill-other    { background: rgba(120,120,120,0.1); border: 1px solid rgba(120,120,120,0.3); color: #777; }

  .group-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; border-radius: 3px; padding: 2px 10px; line-height: 1.8;
    border: 1px solid;
  }
  .group-pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .modal-divider {
    height: 1px; background: linear-gradient(90deg, transparent, #3a2e1a, transparent);
    margin: 16px 0;
  }
  .modal-members-title {
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: #4a3820; margin-bottom: 10px;
  }
  .modal-member { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .modal-member-idx {
    font-family: 'Playfair Display', serif; font-size: 10px;
    color: #3a2a14; min-width: 16px; text-align: right; flex-shrink: 0;
  }
  .modal-member-name { font-size: 13px; color: #8a6a3a; letter-spacing: 0.06em; }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: #3a2e1a;
    font-size: 18px; cursor: pointer; line-height: 1; transition: color 0.15s;
  }
  .modal-close:hover { color: #c9a96e; }
  .modal-card::-webkit-scrollbar { width: 4px; }
  .modal-card::-webkit-scrollbar-thumb { background: #3a2e1a; border-radius: 4px; }
</style>
</head>
<body>

<!-- Loading / Error Screen -->
<div id="status-screen">
  <div id="status-title">Table Allotment</div>
  <div class="spinner" id="status-spinner"></div>
  <div id="status-msg">Loading data.csv…</div>
</div>

<!-- Detail Modal -->
<div id="detail-modal">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-card" id="modal-card">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-top-line"></div>
    <div class="modal-table-num" id="m-table-num">Table —</div>
    <div class="modal-team-name" id="m-team-name">—</div>
    <div class="modal-row">
      <div class="modal-row-label">Problem</div>
      <div class="modal-row-value" id="m-problem">—</div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">Problem Group</div>
      <div class="modal-row-value">
        <span id="m-group" class="group-pill">
          <span class="group-pill-dot" id="m-group-dot"></span>
          <span id="m-group-text">—</span>
        </span>
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">Team Size</div>
      <div class="modal-row-value" id="m-size">—</div>
    </div>
    <div class="modal-row">
      <div class="modal-row-label">Participant Type</div>
      <div class="modal-row-value"><span id="m-ptype" class="participant-pill pill-other">—</span></div>
    </div>
    <div class="modal-divider"></div>
    <div class="modal-members-title">Members</div>
    <div id="m-members"></div>
  </div>
</div>

<div class="venue">Table Allotment</div>
<h1>Details</h1>

<div class="top-bar">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot normal"></div> Assigned</div>
    <div class="legend-item"><div class="legend-dot ext"></div> External</div>
    <div class="legend-item"><div class="legend-dot hl"></div> Highlighted</div>
  </div>
  <button id="reload-btn" onclick="loadCSV()">↺ Reload</button>
</div>

<div class="grid" id="grid"></div>
<div class="group-legend" id="group-legend"></div>
<p class="footer">Click · details &nbsp;|&nbsp; Double-click · highlight &nbsp;|&nbsp; Bottom color bar · problem group &nbsp;|&nbsp; Click group label below · filter</p>

<script>
  // ── 10 distinct muted colors for up to 10 problem groups ─────────────────────
  const GROUP_PALETTE = [
    '#7a9fcf', '#c97a7a', '#c9b97a', '#9a7ac9', '#7ac9a8',
    '#c9a07a', '#c9c07a', '#7ac9c9', '#c97ab0', '#a8c97a',
  ];

  const groupColorMap = {};
  let groupOrder = [];

  function getGroupColor(prefix) {
    if (!prefix) return null;
    if (!groupColorMap[prefix]) {
      const idx = groupOrder.length % GROUP_PALETTE.length;
      groupColorMap[prefix] = GROUP_PALETTE[idx];
      groupOrder.push(prefix);
    }
    return groupColorMap[prefix];
  }

  // ── CSV Parsing ──────────────────────────────────────────────────────────────
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return {};
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/\s+/g, '_'));
    const map = {};
    for (let i = 1; i < lines.length; i++) {
      const cols = splitCSVLine(lines[i]);
      if (!cols.length) continue;
      const row = {};
      headers.forEach((h, idx) => { row[h] = (cols[idx] || '').trim(); });
      const num = parseInt(row['team_number'] || row['table_number'] || row['table'] || row['team'] || '');
      if (isNaN(num)) continue;
      const ptype  = (row['participant_type'] || '').toLowerCase().trim();
      const isExt  = ptype === 'external';
      const members = [
        row['member1_name'], row['member2_name'], row['member3_name'],
        row['member4_name'], row['member5_name'], row['member6_name']
      ].filter(m => m && m.toLowerCase() !== 'nil' && m !== '');
      map[num] = {
        team: row['team_name'] || '',
        problem: row['problem_statement'] || '',
        size: row['team_size'] || '',
        participantType: row['participant_type'] || '',
        members, isExternal: isExt
      };
    }
    return map;
  }

  function splitCSVLine(line) {
    const result = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  // ── Filter by group ──────────────────────────────────────────────────────────
  let activeFilter = null;

  function applyFilter(prefix) {
    activeFilter = (activeFilter === prefix) ? null : prefix;
    document.querySelectorAll('.cell').forEach(cell => {
      cell.style.opacity = (!activeFilter || cell.dataset.group === activeFilter) ? '' : '0.15';
    });
    document.querySelectorAll('.group-legend-item').forEach(item => {
      item.classList.toggle('active', item.dataset.group === activeFilter);
    });
  }

  // ── Modal ────────────────────────────────────────────────────────────────────
  let clickTimer = null;

  function openModal(tableNum, data) {
    const card = document.getElementById('modal-card');
    document.getElementById('m-table-num').textContent = `Table ${tableNum}`;
    document.getElementById('m-team-name').textContent = data.team || '—';
    document.getElementById('m-problem').textContent   = data.problem || '—';
    document.getElementById('m-size').textContent      = data.size || '—';

    const prefix = data.problem ? data.problem.substring(0, 3).toUpperCase() : null;
    const gColor = prefix ? (groupColorMap[prefix] || getGroupColor(prefix)) : null;
    document.getElementById('m-group-text').textContent  = prefix || '—';
    document.getElementById('m-group-dot').style.background = gColor || '#555';
    const gPill = document.getElementById('m-group');
    gPill.style.color       = gColor || '#9a7a4a';
    gPill.style.borderColor = gColor ? gColor + '55' : '#3a2e1a';
    gPill.style.background  = gColor ? gColor + '14' : 'transparent';

    const ptEl  = document.getElementById('m-ptype');
    const ptype = data.participantType || '—';
    ptEl.textContent = ptype;
    ptEl.className   = 'participant-pill';
    const ptl = ptype.toLowerCase();
    ptEl.classList.add(ptl === 'external' ? 'pill-external' : ptl === 'internal' ? 'pill-internal' : 'pill-other');

    const membersEl = document.getElementById('m-members');
    membersEl.innerHTML = '';
    if (data.members && data.members.length) {
      data.members.forEach((m, i) => {
        const r = document.createElement('div');
        r.className = 'modal-member';
        r.innerHTML = `<div class="modal-member-idx">${i+1}.</div><div class="modal-member-name">${m}</div>`;
        membersEl.appendChild(r);
      });
    } else {
      membersEl.innerHTML = '<div class="modal-member-name" style="color:#2e2416;font-style:italic;font-size:11px;padding-left:4px;">No members listed</div>';
    }

    card.className = 'modal-card' + (data.isExternal ? ' external-card' : '');
    document.getElementById('detail-modal').classList.add('open');
  }

  function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── Grid Builder ─────────────────────────────────────────────────────────────
  function buildGrid(teamData) {
    Object.keys(groupColorMap).forEach(k => delete groupColorMap[k]);
    groupOrder = [];
    activeFilter = null;

    for (let n = 1; n <= 100; n++) {
      const d = teamData[n];
      if (d && d.problem) getGroupColor(d.problem.substring(0, 3).toUpperCase());
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    for (let row = 0; row < 10; row++) {
      for (let col = 0; col < 10; col++) {
        const tableNum = (row + 1) * 10 - col;
        const data = teamData[tableNum] || { team:'', problem:'', members:[], isExternal:false, participantType:'' };

        const prefix = data.problem ? data.problem.substring(0, 3).toUpperCase() : null;
        const gColor = prefix ? groupColorMap[prefix] : null;

        const cell = document.createElement('div');
        cell.className = 'cell' + (data.isExternal ? ' external' : '');
        cell.style.animationDelay = ((row * 10 + col) * 5) + 'ms';
        if (prefix) cell.dataset.group = prefix;

        const inner = document.createElement('div');
        inner.className = 'inner';

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = tableNum;

        const label = document.createElement('div');
        label.className = 'label';
        label.contentEditable = 'true';
        label.setAttribute('data-placeholder', data.problem || '···');
        label.spellcheck = false;
        label.textContent = data.problem || '';
        label.addEventListener('keydown', e => { if (e.key==='Enter'){e.preventDefault();label.blur();} });
        label.addEventListener('click', e => e.stopPropagation());

        const teamLabel = document.createElement('div');
        teamLabel.className = 'team-label';
        teamLabel.contentEditable = 'true';
        teamLabel.setAttribute('data-placeholder', 'Team name');
        teamLabel.spellcheck = false;
        teamLabel.textContent = data.team || '';
        teamLabel.addEventListener('keydown', e => { if (e.key==='Enter'){e.preventDefault();teamLabel.blur();} });
        teamLabel.addEventListener('click', e => e.stopPropagation());

        inner.appendChild(num);
        inner.appendChild(label);
        inner.appendChild(teamLabel);

        if (data.isExternal) {
          const badge = document.createElement('div');
          badge.className = 'ext-badge';
          badge.textContent = 'External';
          inner.appendChild(badge);
        }

        cell.appendChild(inner);

        if (gColor) {
          const strip = document.createElement('div');
          strip.className = 'group-strip';
          strip.style.background = gColor;
          cell.appendChild(strip);
        }

        cell.addEventListener('click', () => {
          if (clickTimer) {
            clearTimeout(clickTimer);
            clickTimer = null;
            cell.classList.toggle('highlighted');
            return;
          }
          clickTimer = setTimeout(() => {
            clickTimer = null;
            openModal(tableNum, data);
          }, 220);
        });

        grid.appendChild(cell);
      }
    }

    buildGroupLegend();
  }

  // ── Group Legend ─────────────────────────────────────────────────────────────
  function buildGroupLegend() {
    const el = document.getElementById('group-legend');
    el.innerHTML = '';
    groupOrder.forEach(prefix => {
      const color = groupColorMap[prefix];
      const item = document.createElement('div');
      item.className = 'group-legend-item';
      item.dataset.group = prefix;
      item.innerHTML = `<div class="group-legend-bar" style="background:${color}"></div>${prefix}`;
      item.title = `Click to filter — show only ${prefix} tables`;
      item.addEventListener('click', () => applyFilter(prefix));
      el.appendChild(item);
    });
  }

  // ── External CSV Loader ──────────────────────────────────────────────────────
  // Place your CSV file named "data.csv" in the same directory as this HTML file.
  // GitHub Pages will serve it automatically from the repo root (or same folder).
  const CSV_FILENAME = 'data.csv';

  function showStatus(msg, isError = false, showSpinner = true) {
    document.getElementById('status-screen').classList.remove('hidden');
    document.getElementById('status-msg').textContent = msg;
    document.getElementById('status-msg').className = isError ? 'error' : '';
    document.getElementById('status-spinner').style.display = showSpinner ? 'block' : 'none';
  }

  function hideStatus() {
    document.getElementById('status-screen').classList.add('hidden');
  }

  async function loadCSV() {
    showStatus(`Loading ${CSV_FILENAME}…`);
    try {
      const res = await fetch(CSV_FILENAME + '?t=' + Date.now()); // cache-bust on reload
      if (!res.ok) throw new Error(`HTTP ${res.status} — file not found`);
      const text = await res.text();
      if (!text.trim()) throw new Error('CSV file is empty');
      buildGrid(parseCSV(text));
      hideStatus();
    } catch (err) {
      showStatus(
        `Could not load "${CSV_FILENAME}"\n${err.message}\n\nMake sure data.csv is in the same folder as this HTML file.`,
        true, false
      );
    }
  }

  // Auto-load on page start
  loadCSV();
</script>
</body>
</html>
